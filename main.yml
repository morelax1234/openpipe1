name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create a fresh React Native project
        run: npx --yes @react-native-community/cli@latest init OpenPipe --package-name com.example.openpipe --skip-git-init

      - name: Add our code
        run: |
          SRC="$(dirname "$(dirname "$(find . -name patch_android.py -not -path './OpenPipe/*' | head -1)")")"
          echo "Source folder: $SRC"
          cp "$SRC/App.tsx" OpenPipe/App.tsx
          cp -r "$SRC/src" OpenPipe/src
          cp -r "$SRC/android-overlay/app/src/." OpenPipe/android/app/src/
          echo "$SRC" > src_dir.txt
          cd OpenPipe && npm install react-native-video@^6

      - name: Patch Gradle and MainApplication
        run: python3 "$(cat src_dir.txt)/scripts/patch_android.py" OpenPipe

      - name: Build release APK
        working-directory: OpenPipe/android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: openpipe-apk
          path: OpenPipe/android/app/build/outputs/apk/release/*.apk
